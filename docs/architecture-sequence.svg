<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 920" role="img" lang="en">

        <title id="archify-diagram-title">SecSight alert lifecycle</title>
        <desc id="archify-diagram-description">From raw detection signal to closed incident</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" style="fill: #948978" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" style="fill: #dd6b3d" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" style="fill: #df9085" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" style="fill: #c0a4d0" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" style="stroke-dasharray: 1 3; opacity: 0.78" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Time Segments -->


        <!-- Lifelines -->
        <path d="M 149.5 142 L 149.5 855" class="a-default" style="stroke: #948978" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 363.83333333333337 142 L 363.83333333333337 855" class="a-default" style="stroke: #948978" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 578.1666666666667 142 L 578.1666666666667 855" class="a-default" style="stroke: #948978" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 792.5 142 L 792.5 855" class="a-default" style="stroke: #948978" stroke-width="0.8" stroke-dasharray="3,7"/>

        <!-- Activations -->


        <!-- Messages -->
        <g data-edge-from="alert" data-edge-to="ingest" data-edge-label="raw event arrives" data-edge-key="0" data-edge-id="m1">
          <path data-composition-edge-from="alert" data-composition-edge-to="ingest" data-composition-edge-id="m1" data-composition-points="156.5,180;356.83333333333337,180" d="M 156.5 180 L 356.83333333333337 180" class="a-emphasis" style="stroke: #dd6b3d" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
          <rect x="206.4666666666667" y="160" width="100.4" height="16" rx="3" class="c-mask" style="fill: #231f18"/>
          <text x="256.6666666666667" y="170" class="t-backend" style="fill: #8fc29e" font-size="9" text-anchor="middle">raw event arrives</text>
        </g>
        </g>

        <g data-edge-from="ingest" data-edge-to="agents" data-edge-label="normalized event in tenant context" data-edge-key="1" data-edge-id="m2">
          <path data-composition-edge-from="ingest" data-composition-edge-to="agents" data-composition-edge-id="m2" data-composition-points="370.83333333333337,280;571.1666666666667,280" d="M 370.83333333333337 280 L 571.1666666666667 280" class="a-emphasis" style="stroke: #dd6b3d" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
          <rect x="376.6" y="260" width="188.8" height="16" rx="3" class="c-mask" style="fill: #231f18"/>
          <text x="471" y="270" class="t-backend" style="fill: #8fc29e" font-size="9" text-anchor="middle">normalized event in tenant context</text>
        </g>
        </g>

        <g data-edge-from="agents" data-edge-to="ingest" data-edge-label="matches verdict → 22 playbooks" data-edge-key="2" data-edge-id="m3">
          <path data-composition-edge-from="agents" data-composition-edge-to="ingest" data-composition-edge-id="m3" data-composition-points="571.1666666666667,380;370.83333333333337,380" d="M 571.1666666666667 380 L 370.83333333333337 380" class="a-default" style="stroke: #948978" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g data-detail="context">
          <rect x="387.00000000000006" y="360" width="168" height="16" rx="3" class="c-mask" style="fill: #231f18"/>
          <text x="471.00000000000006" y="370" class="t-muted" style="fill: #b9ae9b" font-size="9" text-anchor="middle">matches verdict → 22 playbooks</text>
        </g>
        </g>

        <g data-edge-from="ingest" data-edge-to="alert" data-edge-label="auto-execute L0–L3 within budget" data-edge-key="3" data-edge-id="m4">
          <path data-composition-edge-from="ingest" data-composition-edge-to="alert" data-composition-edge-id="m4" data-composition-points="356.83333333333337,460;156.5,460" d="M 356.83333333333337 460 L 156.5 460" class="a-emphasis" style="stroke: #dd6b3d" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
          <rect x="167.4666666666667" y="440" width="178.4" height="16" rx="3" class="c-mask" style="fill: #231f18"/>
          <text x="256.6666666666667" y="450" class="t-backend" style="fill: #8fc29e" font-size="9" text-anchor="middle">auto-execute L0–L3 within budget</text>
        </g>
        </g>

        <g data-edge-from="agents" data-edge-to="human" data-edge-label="L4 over budget → human review" data-edge-key="4" data-edge-id="m5">
          <path data-composition-edge-from="agents" data-composition-edge-to="human" data-composition-edge-id="m5" data-composition-points="585.1666666666667,560;785.5,560" d="M 585.1666666666667 560 L 785.5 560" class="a-emphasis" style="stroke: #dd6b3d" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
          <rect x="603.9333333333334" y="540" width="162.8" height="16" rx="3" class="c-mask" style="fill: #231f18"/>
          <text x="685.3333333333334" y="550" class="t-backend" style="fill: #8fc29e" font-size="9" text-anchor="middle">L4 over budget → human review</text>
        </g>
        </g>

        <g data-edge-from="human" data-edge-to="agents" data-edge-label="approve · modify · reject" data-edge-key="5" data-edge-id="m6">
          <path data-composition-edge-from="human" data-composition-edge-to="agents" data-composition-edge-id="m6" data-composition-points="785.5,640;585.1666666666667,640" d="M 785.5 640 L 585.1666666666667 640" class="a-default" style="stroke: #948978" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g data-detail="context">
          <rect x="614.3333333333334" y="620" width="142" height="16" rx="3" class="c-mask" style="fill: #231f18"/>
          <text x="685.3333333333334" y="630" class="t-muted" style="fill: #b9ae9b" font-size="9" text-anchor="middle">approve · modify · reject</text>
        </g>
        </g>

        <g data-edge-from="agents" data-edge-to="alert" data-edge-label="incident closed + postmortem" data-edge-key="6" data-edge-id="m7">
          <path data-composition-edge-from="agents" data-composition-edge-to="alert" data-composition-edge-id="m7" data-composition-points="571.1666666666667,740;156.5,740" d="M 571.1666666666667 740 L 156.5 740" class="a-emphasis" style="stroke: #dd6b3d" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
          <rect x="285.03333333333336" y="720" width="157.6" height="16" rx="3" class="c-mask" style="fill: #231f18"/>
          <text x="363.83333333333337" y="730" class="t-backend" style="fill: #8fc29e" font-size="9" text-anchor="middle">incident closed + postmortem</text>
        </g>
        </g>

        <!-- Segment Labels -->


        <!-- Participants -->
        <g id="node-alert" data-node-id="alert" data-node-label="Alert" tabindex="0" role="button" aria-label="Focus Alert, SIEM / NIDS, Sequence participant" aria-pressed="false" data-node-kind="external" data-node-sublabel="SIEM / NIDS" data-node-context="Sequence participant">
          <title>Alert · SIEM / NIDS · Sequence participant</title>
          <rect x="62" y="72" width="175" height="54" rx="6" class="c-mask" style="fill: #231f18"/>
          <rect x="62" y="72" width="175" height="54" rx="6" class="c-external" style="fill: rgba(126, 115, 96, 0.18); stroke: #b8ad99" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="external" class="semantic-sigil s-external" style="stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; opacity: 0.76; color: #b8ad99" transform="translate(68 78) scale(0.6875)">
            <rect x="2.5" y="5" width="8.5" height="8" rx="1.5"/>
            <path d="M8 2.5h5.5V8M13.5 2.5 7.5 8.5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="149.5" y="94" class="t-primary" style="fill: #f4eddf" font-size="11" font-weight="600" text-anchor="middle">Alert</text>
          <text data-detail="context" x="149.5" y="111" class="t-muted" style="fill: #b9ae9b" font-size="7" text-anchor="middle">SIEM / NIDS</text>
        </g>

        <g id="node-ingest" data-node-id="ingest" data-node-label="Ingest" tabindex="0" role="button" aria-label="Focus Ingest, normalize · tag, Sequence participant" aria-pressed="false" data-node-kind="backend" data-node-sublabel="normalize · tag" data-node-context="Sequence participant">
          <title>Ingest · normalize · tag · Sequence participant</title>
          <rect x="276.33333333333337" y="72" width="175" height="54" rx="6" class="c-mask" style="fill: #231f18"/>
          <rect x="276.33333333333337" y="72" width="175" height="54" rx="6" class="c-backend" style="fill: rgba(63, 132, 92, 0.16); stroke: #8fc29e" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" style="stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; opacity: 0.76; color: #8fc29e" transform="translate(282.33333333333337 78) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="363.83333333333337" y="94" class="t-primary" style="fill: #f4eddf" font-size="11" font-weight="600" text-anchor="middle">Ingest</text>
          <text data-detail="context" x="363.83333333333337" y="111" class="t-muted" style="fill: #b9ae9b" font-size="7" text-anchor="middle">normalize · tag</text>
        </g>

        <g id="node-agents" data-node-id="agents" data-node-label="Copilot" tabindex="0" role="button" aria-label="Focus Copilot, multi-agent + SOAR, Sequence participant" aria-pressed="false" data-node-kind="cloud" data-node-sublabel="multi-agent + SOAR" data-node-context="Sequence participant">
          <title>Copilot · multi-agent + SOAR · Sequence participant</title>
          <rect x="490.66666666666674" y="72" width="175" height="54" rx="6" class="c-mask" style="fill: #231f18"/>
          <rect x="490.66666666666674" y="72" width="175" height="54" rx="6" class="c-cloud" style="fill: rgba(170, 119, 49, 0.16); stroke: #d8ad68" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="cloud" class="semantic-sigil s-cloud" style="stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; opacity: 0.76; color: #d8ad68" transform="translate(496.66666666666674 78) scale(0.6875)">
            <path d="M4.3 12.5h7.3a2.4 2.4 0 0 0 .2-4.8 4 4 0 0 0-7.5-1.3A3.1 3.1 0 0 0 4.3 12.5Z"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="578.1666666666667" y="94" class="t-primary" style="fill: #f4eddf" font-size="11" font-weight="600" text-anchor="middle">Copilot</text>
          <text data-detail="context" x="578.1666666666667" y="111" class="t-muted" style="fill: #b9ae9b" font-size="7" text-anchor="middle">multi-agent + SOAR</text>
        </g>

        <g id="node-human" data-node-id="human" data-node-label="Human" tabindex="0" role="button" aria-label="Focus Human, L4 reviewer, Sequence participant" aria-pressed="false" data-node-kind="external" data-node-sublabel="L4 reviewer" data-node-context="Sequence participant">
          <title>Human · L4 reviewer · Sequence participant</title>
          <rect x="705" y="72" width="175" height="54" rx="6" class="c-mask" style="fill: #231f18"/>
          <rect x="705" y="72" width="175" height="54" rx="6" class="c-external" style="fill: rgba(126, 115, 96, 0.18); stroke: #b8ad99" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="external" class="semantic-sigil s-external" style="stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; opacity: 0.76; color: #b8ad99" transform="translate(711 78) scale(0.6875)">
            <rect x="2.5" y="5" width="8.5" height="8" rx="1.5"/>
            <path d="M8 2.5h5.5V8M13.5 2.5 7.5 8.5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="792.5" y="94" class="t-primary" style="fill: #f4eddf" font-size="11" font-weight="600" text-anchor="middle">Human</text>
          <text data-detail="context" x="792.5" y="111" class="t-muted" style="fill: #b9ae9b" font-size="7" text-anchor="middle">L4 reviewer</text>
        </g>

        <!-- Legend -->
        <g data-legend="">
          <text x="40" y="846" class="t-primary" style="fill: #f4eddf" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="emphasis" data-legend-x="40" data-legend-baseline="866" data-legend-width="78">
            <path d="M 40 863 L 74 863" class="a-emphasis" style="stroke: #dd6b3d" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="866" class="t-muted" style="fill: #b9ae9b" font-size="10" font-weight="500">request</text>
          </g>
          <g data-legend-semantic-kind="return" data-legend-x="140" data-legend-baseline="866" data-legend-width="73">
            <path d="M 140 863 L 174 863" class="a-default" style="stroke: #948978" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
            <text x="183" y="866" class="t-muted" style="fill: #b9ae9b" font-size="10" font-weight="500">return</text>
          </g>
        </g>
      
</svg>