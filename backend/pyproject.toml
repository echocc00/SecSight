[project]
name = "secsight-backend"
version = "0.1.0"
description = "SecSight AI-driven security operations platform - backend"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # AI 编排 (LangGraph + LangChain)
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",

    # LLM 网关客户端 (LiteLLM,OpenAI 兼容)
    "litellm>=1.40.0",
    "openai>=1.30.0",

    # 向量库
    "qdrant-client>=1.9.0",

    # 数据库
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",

    # 告警/日志检索 (OpenSearch,经 HTTP API,不 import Wazuh)
    "opensearch-py>=2.4.0",

    # MCP 工具协议
    "mcp>=0.1.0",

    # HTTP 客户端 (调用隔离组件: Shuffle/OpenCTI/IRIS)
    "httpx>=0.27.0",

    # YAML (剧本/策略)
    "pyyaml>=6.0.1",

    # 可观测
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",

    # 安全
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

# ⚠️ License 隔离约束 (见 AGENTS.md):
# 禁止安装: shuffle-sdk / wazuh-sdk / velociraptor / iris-modules(AGPL)
# 仅通过 HTTP 调用这些独立服务
