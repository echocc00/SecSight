# SecSight Phase2 docker-compose — 生产化全栈
# 7 组件真实部署 + 健康检查 + 资源限制 + 网络隔离
# 用法: cp .env.example .env && docker compose up -d
# 文档: docs/deploy-guide.md

x-common-env: &common-env
  TZ: Asia/Shanghai

x-healthcheck-base: &hc-base
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

x-restart: &restart-policy
  restart: unless-stopped

networks:
  secsight-net:
    driver: bridge
  infra-net:
    driver: bridge
  isolation-net:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  opensearch-data:
  wazuh-indexer-data:
  wazuh-manager-data:
  shuffle-data:
  opencti-data:
  iris-data:
  redis-data:

services:
  # ============ SecSight 主体组 (可闭源) ============
  postgres:
    image: postgres:16-alpine
    <<: *restart-policy
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [secsight-net]
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  redis:
    image: redis:7-alpine
    <<: *restart-policy
    volumes: [redis-data:/data]
    networks: [secsight-net]
    healthcheck:
      <<: *hc-base
      test: ["CMD", "redis-cli", "ping"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  qdrant:
    image: qdrant/qdrant:latest
    <<: *restart-policy
    environment:
      <<: *common-env
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes: [qdrant-data:/qdrant/storage]
    networks: [secsight-net]
    ports: ["6333:6333"]
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    <<: *restart-policy
    environment:
      <<: *common-env
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes: [./litellm-config.yaml:/app/config.yaml:ro]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [secsight-net]
    ports: ["4000:4000"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health/liveliness || exit 1"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  secsight-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    <<: *restart-policy
    env_file: .env
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      LITELLM_BASE_URL: http://litellm:4000/v1
      PLAYBOOKS_DIR: /app/playbooks
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    networks: [secsight-net, isolation-net, infra-net]
    ports: ["8000:8000"]
    volumes:
      - ../playbooks:/app/playbooks:ro
      - ../knowledge:/app/knowledge
      - ../policies:/app/policies:ro
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  secsight-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    <<: *restart-policy
    depends_on:
      secsight-backend: { condition: service_healthy }
    networks: [secsight-net]
    ports: ["8080:80"]
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  # ============ 基础设施组 ============
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    <<: *restart-policy
    environment:
      <<: *common-env
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: [opensearch-data:/usr/share/opensearch/data]
    networks: [infra-net, secsight-net]
    ports: ["9200:9200"]
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "curl -sk -u admin:${OPENSEARCH_PASSWORD} https://localhost:9200/_cluster/health | grep -q '\"status\"' || exit 1"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 4g }

  vector:
    image: timberio/vector:0.36.0-debian
    <<: *restart-policy
    environment:
      <<: *common-env
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
    volumes: [./vector.toml:/etc/vector/vector.toml:ro]
    networks: [infra-net, secsight-net]
    depends_on:
      opensearch: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  wazuh-manager:
    image: wazuh/wazuh-manager:4.8.0
    <<: *restart-policy
    hostname: wazuh-manager
    environment:
      <<: *common-env
      INDEXER_URL: https://wazuh-indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: none
    volumes: [wazuh-manager-data:/var/ossec/data]
    networks: [infra-net]
    ports:
      - "1614:1514"
      - "1615:1515"
      - "55100:55000"
    depends_on:
      wazuh-indexer: { condition: service_started }
    healthcheck:
      <<: *hc-base
      start_period: 120s
      test: ["CMD-SHELL", "curl -sf https://localhost:55000/healthcheck || exit 1"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.8.0
    <<: *restart-policy
    hostname: wazuh-indexer
    environment:
      <<: *common-env
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
    volumes: [wazuh-indexer-data:/var/ossec/indexer]
    networks: [infra-net]
    ports: ["9201:9200"]
    healthcheck:
      <<: *hc-base
      start_period: 90s
      test: ["CMD-SHELL", "curl -sk https://localhost:9200/_cluster/health >/dev/null 2>&1 || curl -sk https://localhost:9200/ >/dev/null 2>&1 || exit 1"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 3g }

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    <<: *restart-policy
    hostname: wazuh-dashboard
    environment:
      <<: *common-env
      INDEXER_URL: https://wazuh-indexer:9200
      WAZUH_API_URL: https://wazuh-manager:55000
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
    networks: [infra-net]
    ports: ["5601:5601"]
    depends_on:
      wazuh-indexer: { condition: service_healthy }
      wazuh-manager: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  # ============ 隔离组 (AGPL/GPL,独立网络) ============
  shuffle:
    image: ghcr.io/frikky/shuffle:latest
    <<: *restart-policy
    environment:
      <<: *common-env
      SHUFFLE_DEFAULT_USERNAME: ${SHUFFLE_DEFAULT_USERNAME}
      SHUFFLE_DEFAULT_PASSWORD: ${SHUFFLE_DEFAULT_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shuffle-db:5432/shuffle
      REDIS_URL: redis:6379
    volumes: [shuffle-data:/shuffle]
    networks: [isolation-net]
    ports: ["3001:3001"]
    depends_on:
      shuffle-db: { condition: service_healthy }
      shuffle-redis: { condition: service_healthy }
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "curl -sf http://localhost:3001 || exit 1"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  shuffle-db:
    image: postgres:16-alpine
    <<: *restart-policy
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shuffle
    volumes: [shuffle-data:/var/lib/postgresql/data]
    networks: [isolation-net]
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]

  shuffle-redis:
    image: redis:7-alpine
    <<: *restart-policy
    networks: [isolation-net]
    healthcheck:
      <<: *hc-base
      test: ["CMD", "redis-cli", "ping"]

  opencti:
    image: opencti/platform:6.2.0
    <<: *restart-policy
    environment:
      <<: *common-env
      OPENCTI_ADMIN_EMAIL: ${OPENCTI_ADMIN_EMAIL}
      OPENCTI_ADMIN_PASSWORD: ${OPENCTI_ADMIN_PASSWORD}
      OPENCTI_ADMIN_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      ELASTICSEARCH__HOST: opensearch-isolated
      REDIS__HOSTNAME: redis-opencti
      MINIO__ENDPOINT: minio
      RABBITMQ__HOSTNAME: rabbitmq-opencti
    depends_on:
      redis-opencti: { condition: service_healthy }
      minio: { condition: service_started }
      rabbitmq-opencti: { condition: service_started }
    networks: [isolation-net]
    ports: ["8082:8080"]
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  redis-opencti:
    image: redis:7-alpine
    <<: *restart-policy
    networks: [isolation-net]
    healthcheck:
      <<: *hc-base
      test: ["CMD", "redis-cli", "ping"]

  minio:
    image: minio/minio:latest
    <<: *restart-policy
    command: server /data
    volumes: [opencti-data:/data]
    networks: [isolation-net]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  rabbitmq-opencti:
    image: rabbitmq:3-management
    <<: *restart-policy
    networks: [isolation-net]
    healthcheck:
      <<: *hc-base
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]

  dfir-iris:
    image: dfir-iris/irisweb:latest
    <<: *restart-policy
    environment:
      <<: *common-env
      IRIS_SECRET_KEY: ${IRIS_SECRET_KEY}
      IRIS_ADMIN_PASSWORD: ${IRIS_ADMIN_PASSWORD}
      IRIS_POSTGRES_PASSWORD: ${IRIS_POSTGRES_PASSWORD}
    networks: [isolation-net]
    ports: ["8001:8000"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  # Prometheus + Grafana (监控)
  prometheus:
    image: prom/prometheus:latest
    <<: *restart-policy
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [secsight-net]
    ports: ["9090:9090"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  grafana:
    image: grafana/grafana:latest
    <<: *restart-policy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ChangeMe_123}
    volumes: [./grafana/provisioning:/etc/grafana/provisioning:ro]
    networks: [secsight-net]
    ports: ["3000:3000"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
